<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modern 登录页面</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap");

    :root {
      --bg-1: #0f1f3d;
      --bg-2: #0a5f78;
      --bg-3: #17a27c;
      --text-main: #f8fbff;
      --text-subtle: #c9def8;
      --card-bg: rgba(9, 20, 44, 0.52);
      --card-border: rgba(255, 255, 255, 0.2);
      --input-bg: rgba(255, 255, 255, 0.08);
      --input-border: rgba(255, 255, 255, 0.18);
      --accent: #4af7cc;
      --accent-2: #6cb2ff;
      --danger: #ff9ea6;
      --success: #95ffca;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      display: grid;
      place-items: center;
      color: var(--text-main);
      font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(120deg, var(--bg-1), var(--bg-2), var(--bg-3));
      background-size: 180% 180%;
      animation: bgFlow 14s ease infinite;
    }

    .ambient {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .blob {
      position: absolute;
      border-radius: 999px;
      filter: blur(8px);
      opacity: 0.5;
      mix-blend-mode: screen;
      animation: float 13s ease-in-out infinite;
    }

    .blob-a {
      width: 340px;
      height: 340px;
      top: -70px;
      left: -60px;
      background: radial-gradient(circle at 30% 30%, #94f9ff, transparent 65%);
    }

    .blob-b {
      width: 380px;
      height: 380px;
      right: -100px;
      bottom: -130px;
      background: radial-gradient(circle at 65% 40%, #8dffd3, transparent 68%);
      animation-delay: 1.5s;
    }

    .blob-c {
      width: 220px;
      height: 220px;
      right: 18%;
      top: 12%;
      background: radial-gradient(circle at 50% 50%, #8db8ff, transparent 70%);
      animation-delay: 3s;
    }

    .login-card {
      width: min(92vw, 430px);
      padding: 30px;
      border-radius: 24px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 18px 45px rgba(5, 10, 30, 0.45);
      animation: reveal 0.8s ease;
    }

    .eyebrow {
      margin: 0 0 6px;
      letter-spacing: 0.08em;
      font-size: 12px;
      font-weight: 600;
      color: #a3f6df;
      text-transform: uppercase;
    }

    .title {
      margin: 0;
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(28px, 4.6vw, 36px);
      line-height: 1.08;
    }

    .subtitle {
      margin: 10px 0 24px;
      color: var(--text-subtle);
      font-size: 14px;
    }

    .field {
      margin-bottom: 14px;
    }

    .label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      color: #d8e8ff;
    }

    .input-wrap {
      position: relative;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--input-border);
      background: var(--input-bg);
      color: var(--text-main);
      font-size: 15px;
      outline: none;
      transition: 0.24s ease;
    }

    input::placeholder {
      color: #b8d2f3;
    }

    input:focus {
      border-color: var(--accent-2);
      box-shadow: 0 0 0 4px rgba(108, 178, 255, 0.22);
      transform: translateY(-1px);
    }

    .row {
      margin: 4px 0 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--text-subtle);
    }

    .remember {
      display: inline-flex;
      gap: 7px;
      align-items: center;
      cursor: pointer;
    }

    .remember input {
      accent-color: #5bd8ff;
    }

    .forgot {
      color: #8af1ff;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .forgot:hover {
      color: #b4fbff;
    }

    .login-btn {
      width: 100%;
      padding: 12px 14px;
      border: none;
      border-radius: 13px;
      cursor: pointer;
      font-family: "Space Grotesk", "Noto Sans SC", sans-serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.03em;
      color: #032637;
      background: linear-gradient(120deg, #9fffe6, #76c6ff, #8dffcf);
      background-size: 200% 200%;
      box-shadow: 0 10px 26px rgba(75, 185, 255, 0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      animation: btnFlow 5.5s ease infinite;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(75, 185, 255, 0.5);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .msg {
      min-height: 24px;
      margin-top: 12px;
      font-size: 13px;
      color: var(--danger);
    }

    @keyframes bgFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) translateX(0); }
      50% { transform: translateY(-18px) translateX(8px); }
    }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(10px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes btnFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 24px 20px;
        border-radius: 20px;
      }

      .subtitle {
        margin-bottom: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <span class="blob blob-a"></span>
    <span class="blob blob-b"></span>
    <span class="blob blob-c"></span>
  </div>

  <main class="login-card">
    <p class="eyebrow">Secure Access</p>
    <h1 class="title">欢迎回来</h1>
    <p class="subtitle">输入账号信息，快速进入你的工作台</p>

    <form id="loginForm" novalidate>
      <div class="field">
        <label class="label" for="username">登录名</label>
        <div class="input-wrap">
          <input id="username" name="username" type="text" placeholder="请输入登录名" autocomplete="username" required />
        </div>
      </div>

      <div class="field">
        <label class="label" for="password">密码</label>
        <div class="input-wrap">
          <input id="password" name="password" type="password" placeholder="请输入密码" autocomplete="current-password" required minlength="6" />
        </div>
      </div>

      <div class="row">
        <label class="remember">
          <input type="checkbox" name="remember" />
          记住我
        </label>
        <a class="forgot" href="#">忘记密码？</a>
      </div>

      <button class="login-btn" type="submit">登 录</button>
      <div id="msg" class="msg"></div>
    </form>
  </main>

  <script>
    const USER_KEY = 'forum_user';
    const form = document.getElementById('loginForm');
    const msg = document.getElementById('msg');

    if (localStorage.getItem(USER_KEY)) {
      window.location.href = './forum.html';
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();

      const username = form.username.value.trim();
      const password = form.password.value;

      msg.style.color = 'var(--danger)';

      if (!username) {
        msg.textContent = '请填写登录名';
        return;
      }

      if (!password) {
        msg.textContent = '请填写密码';
        return;
      }

      if (password.length < 6) {
        msg.textContent = '密码至少为 6 位';
        return;
      }

      localStorage.setItem(USER_KEY, username);
      msg.style.color = 'var(--success)';
      msg.textContent = '登录成功，正在进入论坛...';

      setTimeout(function () {
        window.location.href = './forum.html';
      }, 350);
    });
  </script>
</body>
</html>
